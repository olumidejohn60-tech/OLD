name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies
        run: npm install
      - name: Bundle three.js so the game works offline
        run: cp node_modules/three/build/three.min.js www/three.min.js
      - name: Add Android project
        run: npx cap add android
      - name: Landscape + vibration permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.VIBRATE"/></manifest>#' $M
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: project-football-27-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
